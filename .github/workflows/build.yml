name: Build SleepGuard APK

# 在 GitHub 的服务器上编译（有完整外网，自动下载 Android SDK / Gradle / 依赖）。
# 触发方式：push 到 main 分支，或在本页 Actions 点 “Run workflow”。
# 产物：在仓库 Releases 页面生成带 app-debug.apk 的下载附件，无需本机翻墙/装任何软件。
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Android SDK 命令行工具
        uses: android-actions/setup-android@v3

      - name: 接受协议并安装 SDK 组件（平台34 + 构建工具）
        run: |
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: 安装 Gradle 8.7（云端自动下载，无需你本机准备）
        run: |
          curl -sL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: 编译 Debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: 上传 APK 成品
        uses: actions/upload-artifact@v4
        with:
          name: sleepguard-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk

      - name: 发布 Release 并附上 APK
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v1.0.0-debug
          name: SleepGuard Debug v1.0.0
          files: android/app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
